</g>
<rect x="20" y="20" width="1160" height="1090" rx="22" fill="none" stroke="#1D2D35" stroke-opacity=".15"/>
<text x="54" y="64" font-family="monospace" font-size="13" font-weight="600" fill="#64564B" letter-spacing="2.2">ABDOU  /  02  —  SELECTED WORK</text>
<text x="1146" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#64564B" letter-spacing="1.4" text-anchor="end">SOFTWARE  ·  SYSTEMS  ·  AI</text>
<path d="M54 86 H1146" stroke="#1D2D35" stroke-opacity=".16"/>
<text x="54" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="500" fill="#1D2D35" letter-spacing="-1.5">Questions became working things.</text>
<text x="54" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#64564B" >A selection of public projects and experiments. Each one starts with a problem worth understanding.</text>
<rect x="54" y="216" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="216" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="252" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">01</text><text x="118" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >DiveeOI</text><text x="78" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Self-hosted AI development environment. Agents read, write</text><text x="78" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >and run code in local projects.</text><text x="570" y="324" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/DiveeOI</text><rect x="610" y="216" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="216" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="252" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">02</text><text x="674" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >Pinefall Engine</text><text x="634" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Experimental 3D game engine and visual editor, with a</text><text x="634" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >headless runtime.</text><text x="1126" y="324" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/Pinefall-Engine</text><rect x="54" y="356" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="356" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="392" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">03</text><text x="118" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >SpectrulenPor</text><text x="78" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Smart-glasses project for spectrum analysis and</text><text x="78" y="448" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >chemical-element detection.</text><text x="570" y="464" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/SpectrulenPor</text><rect x="610" y="356" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="356" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="392" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">04</text><text x="674" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >NoRav</text><text x="634" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >A proxy-backed browsing workspace built around a focused</text><text x="634" y="448" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >desktop-style interface.</text><text x="1126" y="464" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/NoRav</text><rect x="54" y="496" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="496" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="532" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">05</text><text x="118" y="534" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >REEO</text><text x="78" y="566" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >A digital logic simulator, revived from the BOOLR project.</text><text x="570" y="604" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/REEO</text><rect x="610" y="496" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="496" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="532" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">06</text><text x="674" y="534" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >GNULense</text><text x="634" y="566" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Distributed GNU.org ingestion and search, from collection</text><text x="634" y="588" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >pipeline to web discovery.</text><text x="1126" y="604" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/GNULense</text><rect x="54" y="636" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="636" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="672" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">07</text><text x="118" y="674" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >SMO</text><text x="78" y="706" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Scoped Modular Orchestration for structuring</text><text x="78" y="728" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >multi-language projects and workflows.</text><text x="570" y="744" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/smo</text><rect x="610" y="636" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="636" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="672" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">08</text><text x="674" y="674" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >Bastion</text><text x="634" y="706" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Controlled file delivery with per-file access rules, audit</text><text x="634" y="728" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >logs and sharded storage.</text><text x="1126" y="744" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/Bastion</text><rect x="54" y="776" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="776" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="812" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">09</text><text x="118" y="814" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >Docxer</text><text x="78" y="846" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Documentation discovery through retrieval, local indexing</text><text x="78" y="868" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >and MCP integration.</text><text x="570" y="884" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/docxer</text><rect x="610" y="776" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="776" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="812" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">10</text><text x="674" y="814" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >MaNPM</text><text x="634" y="846" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Go-powered package installation orchestrator with parallel</text><text x="634" y="868" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >direct-to-disk extraction.</text><text x="1126" y="884" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/MaNPM</text><rect x="54" y="916" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="54" y="916" width="5" height="126" rx="2.5" fill="#307344"/><text x="77" y="952" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">11</text><text x="118" y="954" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >Violin</text><text x="78" y="986" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Structured logging for Node.js and Bun, with transports,</text><text x="78" y="1008" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >redaction and Fastify support.</text><text x="570" y="1024" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/violin</text><rect x="610" y="916" width="536" height="126" rx="16" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><rect x="610" y="916" width="5" height="126" rx="2.5" fill="#756D45"/><text x="633" y="952" font-family="monospace" font-size="12" font-weight="700" fill="#307344" letter-spacing="1">12</text><text x="674" y="954" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1D2D35" >Dpino</text><text x="634" y="986" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Rust tooling for package metadata, desktop entries,</text><text x="634" y="1008" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >installation and browsing.</text><text x="1126" y="1024" font-family="monospace" font-size="11" font-weight="500" fill="#307344" text-anchor="end">github.com/abdou-da0wew/Dpino</text><text x="56" y="1080" font-family="monospace" font-size="11" font-weight="600" fill="#64564B" letter-spacing="1.2">A WORKING ARCHIVE, NOT A CLAIM THAT EVERY EXPERIMENT IS FINISHED.</text></svg>
