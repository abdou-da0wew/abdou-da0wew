<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">Abdou — SELECTED WORK</title>
<desc id="desc">A selection of public projects and experiments. Each one starts with a problem worth understanding.</desc>
<rect width="1200" height="1130" rx="28" fill="#FAFDF9"/>
<g opacity=".42">
  <circle cx="1090" cy="30" r="250" fill="#E4F5E0"/>
  <circle cx="80" cy="1110" r="190" fill="#F4FBF3"/>
  <path d="M0 120 L1200 120 M0 1050 L1200 1050" stroke="#1D2D35" stroke-opacity=".035" stroke-width="1"/>
  <path d="M-100 0 L1100 1130 M0 -100 L1200 1030" stroke="#307344" stroke-opacity=".045" stroke-width="2"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; 22 12; 0 0" dur="72s" repeatCount="indefinite"/>
</g>
<g opacity=".14">
  <circle cx="1085" cy="90" r="100" fill="none" stroke="#307344" stroke-width="1.4"/>
  <circle cx="1085" cy="90" r="72" fill="none" stroke="#1D2D35" stroke-width="1"/>
