<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Abdou — Software and systems</title>
<desc id="desc">An introduction to Abdou and the software he builds.</desc>
<rect width="1200" height="390" fill="#FAFDF9"/>
<ellipse cx="984.0" cy="292.5" rx="216.0" ry="132.6" fill="#E4F5E0" opacity=".34"><animate attributeName="cx" values="984.0;942.0;984.0" dur="87s" repeatCount="indefinite"/></ellipse>
<path d="M48 362 H1152" stroke="#1D2D35" stroke-opacity=".10" stroke-width="1"/>
<text x="58" y="58" font-family="monospace" font-size="14" font-weight="600" fill="#307344" letter-spacing="2.2">ABDOU</text><text x="1140" y="58" font-family="monospace" font-size="13" font-weight="500" fill="#64564B" text-anchor="end" letter-spacing="1.1">SOFTWARE  /  SYSTEMS  /  AI</text><path d="M58 82 H1142" stroke="#1D2D35" stroke-opacity=".16"/><text x="54" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" fill="#1D2D35" letter-spacing="-3">I build software</text><text x="54" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" fill="#307344" font-style="italic" letter-spacing="-3">that holds together.</text><text x="60" y="334" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#302E26" >From the interface to the runtime: product, APIs, infrastructure and tools.</text><text x="60" y="362" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64564B" >I like understanding the whole system, then making it work better.</text><text x="1140" y="362" font-family="monospace" font-size="11" font-weight="500" fill="#64564B" text-anchor="end" letter-spacing="1">FULL-STACK  ·  SYSTEMS</text></svg>
