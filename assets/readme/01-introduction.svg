<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Abdou — software and systems</title><desc id="desc">Abdou builds software from interfaces and APIs to runtimes, infrastructure and AI tools.</desc><rect width="1200" height="420" fill="#FAFDF9"/><ellipse cx="925" cy="201" rx="210" ry="180" fill="#E4F5E0" opacity=".34"><animate attributeName="cx" values="900;960;900" dur="112s" repeatCount="indefinite"/></ellipse><path d="M64 16 H1136 Q1174 16 1174 54 V382 Q1174 404 1152 404 H64 Q26 404 26 366 V54 Q26 16 64 16 Z" fill="#F4FBF3" fill-opacity="1" stroke="#E0E8DE" stroke-width="1"/><text x="66" y="66" font-family="monospace" font-size="14" font-weight="600" fill="#307344" letter-spacing="2.2">ABDOU</text><text x="1136" y="66" font-family="monospace" font-size="13" font-weight="500" fill="#64564B" text-anchor="end" letter-spacing="1.1">SOFTWARE  /  SYSTEMS  /  AI</text><path d="M66 88 H1134" stroke="#1D2D35" stroke-opacity=".14"/><text x="64" y="199" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" fill="#1D2D35" letter-spacing="-3">I build software</text><text x="64" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" fill="#307344" font-style="italic" letter-spacing="-3">that holds together.</text><text x="70" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#302E26" >From the interface to the runtime: product, APIs, infrastructure and tools.</text><text x="70" y="369" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64564B" >I like understanding the whole system, then making it work better.</text><text x="1132" y="369" font-family="monospace" font-size="12" font-weight="500" fill="#64564B" text-anchor="end" letter-spacing=".9">FULL-STACK  ·  SYSTEMS</text></svg>
