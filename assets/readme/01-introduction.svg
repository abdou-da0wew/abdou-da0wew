<text x="54" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#64564B" >Ideas made real.</text>
<text x="55" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="500" fill="#1D2D35" >I&#x27;m Abdou. I build software across the stack.</text><text x="55" y="306" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#64564B" >Interfaces, APIs, runtimes, infrastructure, AI tools,</text><text x="55" y="335" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#64564B" >and experiments that connect software with the physical world.</text><rect x="55" y="365" width="350" height="38" rx="19" fill="#E4F5E0" stroke="none" stroke-width="0"/><text x="76" y="390" font-family="monospace" font-size="13" font-weight="700" fill="#307344" letter-spacing="1.2">MAKE CURIOSITY EXECUTABLE</text><rect x="790" y="218" width="350" height="170" rx="20" fill="#1D2D35" stroke="#1D2D35" stroke-width="1"/><text x="822" y="258" font-family="monospace" font-size="13" font-weight="600" fill="#D0D2C3" letter-spacing="1.4">01  /  ENGINEERING</text><text x="822" y="302" font-family="monospace" font-size="13" font-weight="600" fill="#D0D2C3" letter-spacing="1.4">02  /  AI &amp; TOOLING</text><text x="822" y="346" font-family="monospace" font-size="13" font-weight="600" fill="#D0D2C3" letter-spacing="1.4">03  /  CREATIVE SOFTWARE</text><circle cx="1090" cy="253" r="5" fill="#9AB99B"/><circle cx="1090" cy="297" r="5" fill="#9AB99B"/><circle cx="1090" cy="341" r="5" fill="#9AB99B"/></svg>
