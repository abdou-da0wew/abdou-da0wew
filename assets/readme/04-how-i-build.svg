<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Abdou — HOW I BUILD</title>
<desc id="desc">The work is more than getting a feature to compile.</desc>
<rect width="1200" height="560" rx="28" fill="#FAFDF9"/>
<g opacity=".42">
  <circle cx="1090" cy="30" r="250" fill="#E4F5E0"/>
  <circle cx="80" cy="540" r="190" fill="#F4FBF3"/>
  <path d="M0 120 L1200 120 M0 480 L1200 480" stroke="#1D2D35" stroke-opacity=".035" stroke-width="1"/>
  <path d="M-100 0 L1100 560 M0 -100 L1200 460" stroke="#307344" stroke-opacity=".045" stroke-width="2"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; 22 12; 0 0" dur="72s" repeatCount="indefinite"/>
</g>
<g opacity=".14">
  <circle cx="1085" cy="90" r="100" fill="none" stroke="#307344" stroke-width="1.4"/>
  <circle cx="1085" cy="90" r="72" fill="none" stroke="#1D2D35" stroke-width="1"/>
  <circle cx="1085" cy="90" r="44" fill="none" stroke="#307344" stroke-width="1"/>
</g>
<rect x="20" y="20" width="1160" height="520" rx="22" fill="none" stroke="#1D2D35" stroke-opacity=".15"/>
<text x="54" y="64" font-family="monospace" font-size="13" font-weight="600" fill="#64564B" letter-spacing="2.2">ABDOU  /  04  —  HOW I BUILD</text>
<text x="1146" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#64564B" letter-spacing="1.4" text-anchor="end">SOFTWARE  ·  SYSTEMS  ·  AI</text>
<path d="M54 86 H1146" stroke="#1D2D35" stroke-opacity=".16"/>
<text x="54" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="500" fill="#1D2D35" letter-spacing="-1.5">Understand the whole system.</text>
<text x="54" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#64564B" >The work is more than getting a feature to compile.</text>
<rect x="54" y="230" width="350" height="248" rx="18" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><text x="80" y="278" font-family="monospace" font-size="14" font-weight="700" fill="#307344" letter-spacing="1.5">01</text><text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="500" fill="#1D2D35" >Think in layers</text><text x="80" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Product shape, interface, API,</text><text x="80" y="401" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >data, runtime and deployment</text><text x="80" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >are one connected system.</text><rect x="426" y="230" width="350" height="248" rx="18" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><text x="452" y="278" font-family="monospace" font-size="14" font-weight="700" fill="#307344" letter-spacing="1.5">02</text><text x="452" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="500" fill="#1D2D35" >Build to learn</text><text x="452" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Working prototypes, measurable</text><text x="452" y="401" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >behavior and real constraints</text><text x="452" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >beat theory that never meets a</text><text x="452" y="451" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >user.</text><rect x="798" y="230" width="350" height="248" rx="18" fill="#FFFFFF" stroke="#D9E2D8" stroke-width="1"/><text x="824" y="278" font-family="monospace" font-size="14" font-weight="700" fill="#307344" letter-spacing="1.5">03</text><text x="824" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="500" fill="#1D2D35" >Keep it honest</text><text x="824" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Performance matters.</text><text x="824" y="401" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Complexity should earn its</text><text x="824" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >place. A demo is not the same</text><text x="824" y="451" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64564B" >as a finished product.</text><text x="56" y="520" font-family="monospace" font-size="12" font-weight="600" fill="#307344" letter-spacing="1.2">FOLLOW AN IDEA FROM THE FIRST SKETCH TO THE RUNNING SYSTEM.</text></svg>
