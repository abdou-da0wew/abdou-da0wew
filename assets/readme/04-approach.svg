<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc"><title id="title">How I work</title><desc id="desc">Systems thinking, practical prototypes and honest complexity.</desc><rect width="1200" height="292" fill="#FAFDF9"/><ellipse cx="936" cy="140" rx="216" ry="160" fill="#E4F5E0" opacity=".3"><animate attributeName="cx" values="936;884;936" dur="108s" repeatCount="indefinite"/></ellipse><path d="M52 12 H1164 Q1178 12 1178 26 V250 Q1178 280 1148 280 H36 Q22 280 22 266 V42 Q22 12 52 12 Z" fill="#17272C" fill-opacity="1" stroke="#17272C" stroke-width="1"/><text x="56" y="55" font-family="monospace" font-size="11" font-weight="600" fill="#9AB99B" letter-spacing="1.8">HOW I BUILD</text><text x="52" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="400" fill="#FFFFFF" letter-spacing="-1.1">Follow the idea</text><text x="52" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="400" fill="#B9D8B9" font-style="italic" letter-spacing="-1.1">all the way down.</text><text x="56" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#D0D2C3" >The interface matters. So does everything underneath it.</text><path d="M620 47 V244" stroke="#FAFDF9" stroke-opacity=".18"/><text x="632" y="76" font-family="monospace" font-size="11" font-weight="600" fill="#9AB99B" >01</text><text x="632" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#FFFFFF" >Think in layers</text><text x="632" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >Product, interface,</text><text x="632" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >data and runtime.</text><path d="M802 47 V244" stroke="#FAFDF9" stroke-opacity=".18"/><text x="814" y="76" font-family="monospace" font-size="11" font-weight="600" fill="#9AB99B" >02</text><text x="814" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#FFFFFF" >Build to understand</text><text x="814" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >Prototype early. Test</text><text x="814" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >real constraints.</text><path d="M984 47 V244" stroke="#FAFDF9" stroke-opacity=".18"/><text x="996" y="76" font-family="monospace" font-size="11" font-weight="600" fill="#9AB99B" >03</text><text x="996" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#FFFFFF" >Keep it honest</text><text x="996" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >Complexity and</text><text x="996" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#D0D2C3" >performance both</text></svg>
