<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">How I build software</title>
<desc id="desc">Engineering principles: think in layers, build to learn, and keep complexity honest.</desc>
<rect width="1200" height="430" fill="#FAFDF9"/>
<ellipse cx="216.0" cy="86.0" rx="216.0" ry="146.2" fill="#E4F5E0" opacity=".34"><animate attributeName="cx" values="216.0;258.0;216.0" dur="96s" repeatCount="indefinite"/></ellipse>
<path d="M48 402 H1152" stroke="#1D2D35" stroke-opacity=".10" stroke-width="1"/>
<text x="58" y="64" font-family="monospace" font-size="12" font-weight="600" fill="#307344" letter-spacing="1.8">APPROACH</text><text x="54" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" fill="#1D2D35" letter-spacing="-1.2">Follow the idea</text><text x="54" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" fill="#307344" font-style="italic" letter-spacing="-1.2">all the way down.</text><text x="58" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64564B" >The interface matters. So does everything underneath it.</text><path d="M680 65 H1140" stroke="#1D2D35" stroke-opacity=".15"/><text x="680" y="100" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >01</text><text x="734" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#1D2D35" >Think in layers</text><text x="734" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#64564B" >Product, interface, data and runtime form one system.</text><path d="M680 169 H1140" stroke="#1D2D35" stroke-opacity=".15"/><text x="680" y="204" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >02</text><text x="734" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#1D2D35" >Build to understand</text><text x="734" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#64564B" >Prototype early. Let real constraints shape the design.</text><path d="M680 273 H1140" stroke="#1D2D35" stroke-opacity=".15"/><text x="680" y="308" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >03</text><text x="734" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" fill="#1D2D35" >Keep complexity honest</text><text x="734" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#64564B" >Performance matters. Complexity must earn its place.</text></svg>
