<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">How I build software</title><desc id="desc">Engineering principles: systems thinking, practical prototypes and honest complexity.</desc><rect width="1200" height="490" fill="#FAFDF9"/><ellipse cx="925" cy="235" rx="210" ry="210" fill="#E4F5E0" opacity=".34"><animate attributeName="cx" values="900;960;900" dur="112s" repeatCount="indefinite"/></ellipse><path d="M60 12 H1154 Q1174 12 1174 32 V444 Q1174 478 1140 478 H46 Q26 478 26 458 V46 Q26 12 60 12 Z" fill="#F4FBF3" fill-opacity="1" stroke="#E0E8DE" stroke-width="1"/><text x="66" y="68" font-family="monospace" font-size="12" font-weight="600" fill="#307344" letter-spacing="1.8">APPROACH</text><text x="62" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#1D2D35" letter-spacing="-1.2">Follow the idea</text><text x="62" y="201" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#307344" font-style="italic" letter-spacing="-1.2">all the way down.</text><text x="66" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64564B" >The interface matters. So does everything underneath it.</text><path d="M674 86 H1112 Q1124 86 1124 98 V160 Q1124 184 1100 184 H662 Q650 184 650 172 V110 Q650 86 674 86 Z" fill="#FFFFFF" fill-opacity="1" stroke="#D8E1D7" stroke-width="1"/><text x="672" y="118" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >01</text><text x="716" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#1D2D35" >Think in layers</text><text x="716" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Product, interface, data and runtime form one system.</text><path d="M662 202 H1100 Q1124 202 1124 226 V288 Q1124 300 1112 300 H674 Q650 300 650 276 V214 Q650 202 662 202 Z" fill="#E4F5E0" fill-opacity="1" stroke="#D8E1D7" stroke-width="1"/><text x="672" y="234" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >02</text><text x="716" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#1D2D35" >Build to understand</text><text x="716" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Prototype early. Let real constraints shape the design.</text><path d="M672 318 H1102 Q1124 318 1124 340 V404 Q1124 416 1112 416 H680 Q650 416 650 386 V340 Q650 318 672 318 Z" fill="#FFFFFF" fill-opacity="1" stroke="#D8E1D7" stroke-width="1"/><text x="672" y="350" font-family="monospace" font-size="12" font-weight="600" fill="#307344" >03</text><text x="716" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#1D2D35" >Keep complexity honest</text><text x="716" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64564B" >Performance matters. Complexity must earn its place.</text></svg>
