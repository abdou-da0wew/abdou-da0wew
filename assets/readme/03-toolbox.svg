ke-width="1"/><text x="636" y="458" font-family="monospace" font-size="13" font-weight="700" fill="#307344" letter-spacing="1.4">04  /  AI &amp; CREATIVE</text><text x="636" y="502" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#302E26" >LLM and retrieval pipelines</text><text x="636" y="532" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#302E26" >Embeddings · ONNX Runtime</text><text x="636" y="562" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#302E26" >Unity · Blender · GPU tooling</text><text x="56" y="642" font-family="monospace" font-size="12" font-weight="600" fill="#64564B" letter-spacing="1.2">I CHOOSE TOOLS AROUND THE SYSTEM THAT NEEDS TO SHIP.</text></svg>
