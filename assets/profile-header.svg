<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Abdou — Systems that work. Ideas made real.</title>
  <desc id="desc">A warm editorial banner in deep ink and green, introducing Abdou's work across software engineering, AI systems, developer tools, and creative software.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1D2D35" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFDF9"/>
      <stop offset=".62" stop-color="#F4FBF3"/>
      <stop offset="1" stop-color="#E4F5E0"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5C6C"/>
      <stop offset=".55" stop-color="#307344"/>
      <stop offset="1" stop-color="#1D2D35"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".28" r=".8">
      <stop offset="0" stop-color="#9AB99B" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9AB99B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" rx="30" fill="url(#paperWash)"/>
  <rect width="1600" height="500" rx="30" fill="url(#grid)"/>
  <circle cx="1040" cy="40" r="390" fill="url(#orb)"/>
  <rect x="28" y="28" width="1544" height="444" rx="22" fill="none" stroke="#1D2D35" stroke-opacity=".14"/>
  <g font-family="monospace" font-size="16" letter-spacing="3.2" fill="#64564B">
    <text x="82" y="92">ABDOU / PERSONAL PROFILE</text>
    <text x="1515" y="92" text-anchor="end">SOFTWARE · SYSTEMS · AI</text>
  </g>
  <path d="M82 118H1518" stroke="#1D2D35" stroke-opacity=".18"/>
  <text x="78" y="242" fill="#1D2D35" font-family="Georgia, 'Times New Roman', serif" font-size="108" letter-spacing="-4">Systems that work.</text>
  <text x="84" y="344" fill="#307344" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="88" letter-spacing="-2">Ideas made real.</text>
  <g font-family="monospace" font-size="16" letter-spacing="1.8" fill="#64564B">
    <text x="86" y="410">FROM INTERFACE TO RUNTIME.</text>
    <text x="86" y="438">BUILT WITH CURIOSITY AND INTENT.</text>
  </g>
  <path d="M82 458H995" stroke="#307344" stroke-width="3"/>
  <g>
    <rect x="1120" y="142" width="398" height="270" rx="20" fill="#1D2D35"/>
    <rect x="1120" y="142" width="398" height="270" rx="20" fill="url(#panelEdge)" opacity=".22"/>
    <circle cx="1454" cy="194" r="82" fill="none" stroke="#FAFDF9" stroke-opacity=".10" stroke-width="1.5"/>
    <circle cx="1454" cy="194" r="58" fill="none" stroke="#FAFDF9" stroke-opacity=".13" stroke-width="1.5"/>
    <circle cx="1454" cy="194" r="34" fill="none" stroke="#9AB99B" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="1454" cy="194" r="7" fill="#9AB99B"/>
    <g font-family="monospace" font-size="13" letter-spacing="1.7" fill="#D0D2C3">
      <text x="1156" y="190">01 / ENGINEERING</text>
      <text x="1156" y="265">02 / AI &amp; TOOLING</text>
      <text x="1156" y="340">03 / CREATIVE SOFTWARE</text>
    </g>
    <g stroke="#FAFDF9" stroke-opacity=".18">
      <path d="M1156 215H1482"/>
      <path d="M1156 290H1482"/>
    </g>
    <g fill="#9AB99B">
      <circle cx="1480" cy="185" r="4"/>
      <circle cx="1480" cy="260" r="4"/>
      <circle cx="1480" cy="335" r="4"/>
    </g>
    <text x="1156" y="382" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#FAFDF9">Make curiosity executable.</text>
  </g>
  <text x="1518" y="448" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#64564B">AD / 001</text>
</svg>
